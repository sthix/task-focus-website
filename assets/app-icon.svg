<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Task Focus app icon</title>
  <desc id="desc">Three overlapping green, yellow, and blue focus rings.</desc>
  <defs>
    <linearGradient id="bg" x1="512" y1="0" x2="512" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F7FB"/>
      <stop offset="1" stop-color="#B7B1E6"/>
    </linearGradient>
    <radialGradient id="shine" cx="0" cy="0" r="1" gradientTransform="translate(350 238) rotate(48) scale(680)">
      <stop stop-color="#FFFFFF" stop-opacity=".78"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#171D25" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="226" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="226" fill="url(#shine)"/>
  <g filter="url(#shadow)" opacity=".9">
    <circle cx="512" cy="512" r="298" fill="none" stroke="#5EB56B" stroke-width="99" opacity=".82"/>
    <circle cx="512" cy="512" r="245" fill="none" stroke="#CBDA3B" stroke-width="82" opacity=".74" style="mix-blend-mode:multiply"/>
    <circle cx="512" cy="512" r="210" fill="none" stroke="#3495D2" stroke-width="70" opacity=".74" style="mix-blend-mode:multiply"/>
  </g>
  <path d="M235 222c108-113 309-156 463-82" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".34"/>
</svg>
